# Mackenzie config file: ~/.config/river/mackenzie.toml

[layout]
n_tags = 3
gap = 10
scroll_edge_gap = 10
default_column_width = 0.6    # % of the output width

[window]
move_resize_step = 15
border_width = 3
border_color_focused = "#1793D0" 
border_color_unfocused = "#333333"

[rules]
windowrules = [
   # { app_id="id", title="some title", width=0.5, floating=true, tag=1, output="output_name" }
   { app_id="org.xfce.mousepad", width = 0.8 },
   #{ app_id="foot", width = 1.0, floating = true },
]

[keybinds]
# See xkbcommon/xkbcommon-keysyms.h
Mod4-space = { action = "spawn", args = ["foot"] }
Mod4-Escape = { action = "quit" }

Mod4-s = { action = "toggle_maximize_column" }
Mod4-d = { action = "toggle_float" }
Mod4-c = { action = "close" }

Mod4-Left = { action = "focus", args = ["left"] }
Mod4-Right = { action = "focus", args = ["right"] }
Mod4-Up = { action = "focus", args = ["up"] }
Mod4-Down = { action = "focus", args = ["down"] }
Mod4-Shift-Left = { action = "resize", args = ["left"] }
Mod4-Shift-Right = { action = "resize", args = ["right"] }
Mod4-Shift-Up = { action = "resize", args = ["up"] }
Mod4-Shift-Down = { action = "resize", args = ["down"] }
Mod4-Ctrl-Left = { action = "move", args = ["left"] }
Mod4-Ctrl-Right = { action = "move", args = ["right"] }
Mod4-Ctrl-Up = { action = "move", args = ["up"] }
Mod4-Ctrl-Down = { action = "move", args = ["down"] }

Mod4-bracketleft  = { action = "switch_columns", args = ["left"] }
Mod4-bracketright = { action = "switch_columns", args = ["right"] }

Mod4-1 = { action = "focus_tag", args = ["1"] }
Mod4-2 = { action = "focus_tag", args = ["2"] }
Mod4-3 = { action = "focus_tag", args = ["3"] }
Mod4-Shift-1 = { action = "move_to_tag", args = ["1"] }
Mod4-Shift-2 = { action = "move_to_tag", args = ["2"] }
Mod4-Shift-3 = { action = "move_to_tag", args = ["3"] }
Mod4-Ctrl-1 = {action = "toggle_tag", args = ["1"] }
Mod4-Ctrl-2 = {action = "toggle_tag", args = ["2"] }
Mod4-Ctrl-3 = {action = "toggle_tag", args = ["3"] }

Mod1-bracketleft = { action = "focus_output", args = ["eDP-1"] }
Mod1-bracketright = { action = "focus_output", args = ["HDMI-A-1"] }
Mod1-Ctrl-bracketleft = { action = "move_to_output", args = ["eDP-1"] }
Mod1-Ctrl-bracketright = { action = "move_to_output", args = ["HDMI-A-1"] }

[mousebinds]
# See linux/input-event-codes.h
Mod1-BTN_LEFT = { action = "move_floating" }
Mod1-BTN_RIGHT = { action = "resize_floating" }
